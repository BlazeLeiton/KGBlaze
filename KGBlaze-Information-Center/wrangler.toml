name = "kgblaze-terminal"
main = "src/worker.mjs"
compatibility_date = "2026-10-12"
workers_dev = true

# Keep dashboard-managed plaintext bindings between automated Workers Builds.
# Production preview still requires the independently managed feature flag.
keep_vars = true

# Cloudflare fires every five minutes in UTC. The Worker throttles
# discovery to the hour, and otherwise refreshes known video IDs.
[triggers]
crons = ["*/5 * * * *"]

# Identificador público del canal ya guardado en Cloudflare Dashboard.
# Mantener en sincronía los deployments de GitHub; NO incluir secretos aquí.
[vars]
YOUTUBE_CHANNEL_ID = "UCRd_uwPjrsf6Z3CRXwNehEQ"
# Separate from YOUTUBE_PREVIEW_ENABLED: enables Stage 7 verified
# upcoming/live observations; cannot assert irreversible completion.
# Emergency pause: Dashboard Text YOUTUBE_SYNC_PAUSED=true.
YOUTUBE_SYNC_ENABLED = "true"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*", "/agenda_publica.json", "/og-semana.png", "/", "/index.html", "/departures", "/departures/*"]

# Binding de diagnostico privado de YouTube, configurado en Cloudflare Dashboard.
# NO habilita la ruta sin YOUTUBE_PREVIEW_ENABLED=true (ausente por defecto).
# Cloudflare Rate Limiting opera por ubicacion, no es cuota diaria global.
[[ratelimits]]
name = "YOUTUBE_PREVIEW_LIMITER"
namespace_id = "1001"

  [ratelimits.simple]
  limit = 1
  period = 60

# Vinculación D1: base de datos creada en Cloudflare por el propietario.
[[d1_databases]]
binding = "DB"
database_name = "kgblaze-terminal"
database_id = "d48b2cf2-cb29-48f1-bb50-1d0a4f66ba37"
