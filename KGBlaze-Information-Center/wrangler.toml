name = "kgblaze-terminal"
main = "src/worker.mjs"
compatibility_date = "2026-10-12"
workers_dev = true

# Preserve plaintext dashboard variables across GitHub Workers Builds deploys.
# Secrets continue to be stored encrypted in Cloudflare, never in this file.
keep_vars = true

# Identificador público del canal ya guardado en Cloudflare Dashboard.
# Mantener en sincronía los deployments de GitHub; NO incluir secretos aquí.
[vars]
YOUTUBE_CHANNEL_ID = "UCRd_uwPjrsf6Z3CRXwNehEQ"
# The user authorized keeping the authenticated, read-only preflight ready.
# This only enables the endpoint; ADMIN_TOKEN + ack + rate limiter still gate it.
YOUTUBE_PREVIEW_ENABLED = "true"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*", "/agenda_publica.json", "/og-semana.png", "/", "/index.html"]

# Binding de diagnostico privado de YouTube, configurado en Cloudflare Dashboard.
# Read-only route is enabled via [vars], but remains admin-only and rate-limited.
# Cloudflare Rate Limiting opera por ubicacion, no es cuota diaria global.
[[ratelimits]]
name = "YOUTUBE_PREVIEW_LIMITER"
namespace_id = "1001"

  [ratelimits.simple]
  limit = 1
  period = 60

# Activar después de conectar las APIs con las credenciales correspondientes.
# [triggers]
# crons = ["*/5 * * * *"]

# Vinculación D1: base de datos creada en Cloudflare por el propietario.
[[d1_databases]]
binding = "DB"
database_name = "kgblaze-terminal"
database_id = "d48b2cf2-cb29-48f1-bb50-1d0a4f66ba37"
