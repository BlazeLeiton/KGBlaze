name: Rename Terminal (one-time)
on:
  push:
    branches: [main]
    paths: ['.github/workflows/terminal-rename-once.yml']
permissions:
  contents: write
jobs:
  rename:
    if: github.repository == 'BlazeLeiton/KGBlaze'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Update public viewer terminology
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("KGBlaze-Information-Center/public/index.html")
          s = p.read_text(encoding="utf-8")
          for old, new in [
              ("TERMINALES A Y B", "TERMINAL"),
              ("Terminales A y B", "Terminal"),
              ("TERMINALS A & B", "TERMINAL"),
              ("ターミナルA・B", "ターミナル"),
              ("TerminalB", "Terminal"),
              ("Terminal B", "Terminal"),
              ("terminalb", "terminal"),
          ]:
              s = s.replace(old, new)
          assert "<title>KGBlaze - Centro de Información</title>" in s
          assert "Terminal B" not in s and "TerminalB" not in s and "terminalb" not in s
          p.write_text(s, encoding="utf-8")
          PY
      - name: Commit viewer change and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/terminal-rename-once.yml
          git add KGBlaze-Information-Center/public/index.html
          git diff --cached --quiet || (git commit -m "refactor: use Terminal across public viewer" && git push)
