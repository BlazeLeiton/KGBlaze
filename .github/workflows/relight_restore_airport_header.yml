name: Restore airport public titles (one-time correction)
on:
  push:
    branches: [main]
    paths:
      - 'KGBlaze-Information-Center/scripts/restore_airport_public_header.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore public airport wording only
        run: python KGBlaze-Information-Center/scripts/restore_airport_public_header.py KGBlaze-Information-Center/public/index.html
      - name: Ensure clean syntax and diff
        run: |
          python KGBlaze-Information-Center/scripts/restore_airport_public_header.py KGBlaze-Information-Center/public/index.html --verify
          git diff --check
      - name: Commit corrected viewer HTML (not deploy)
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add KGBlaze-Information-Center/public/index.html
          if ! git diff --cached --quiet; then
            git commit -m "fix(viewer): restore airport Terminals A and B in ES EN JA"
            git push
          fi
