name: Arcana visor refinement
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, closed]
    branches: [main]
permissions:
  contents: read
jobs:
  restore:
    if: github.event.action != 'closed' && github.head_ref == 'relight/arcana-visor-refinement' && github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: relight/arcana-visor-refinement
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Preserve selected anime artwork
        working-directory: KGBlaze-Information-Center
        run: |
          python -m pip install Pillow
          python scripts/preserve-artwork.py --strict
      - name: Record only the selected new artwork and manifest
        run: |
          git add KGBlaze-Information-Center/public/music-artwork/kenka-v2.webp KGBlaze-Information-Center/public/music-artwork/bad-candy-v2.webp KGBlaze-Information-Center/public/music-artwork/hikari-aru-basho-e-v2.webp KGBlaze-Information-Center/public/music-artwork/preserved-v2.json
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Preserve three revised anime jackets"
            git push origin HEAD:relight/arcana-visor-refinement
          fi
      - name: Regression suite
        working-directory: KGBlaze-Information-Center
        run: npm test
      - name: Browser audit
        working-directory: KGBlaze-Information-Center
        run: |
          npm install --no-save --package-lock=false playwright
          npx playwright install chromium
          node scripts/audit-artwork-visual.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arcana-visor-audit
          path: KGBlaze-Information-Center/artwork-audit/
          if-no-files-found: ignore
  production:
    if: github.event.action == 'closed' && github.event.pull_request.merged == true && github.event.pull_request.head.ref == 'relight/arcana-visor-refinement'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify published artwork and language label
        working-directory: KGBlaze-Information-Center
        run: |
          node scripts/verify-artwork-production.mjs
          node --input-type=module -e 'const h=await (await fetch("https://kgblaze.dpdns.org/music/?audit="+Date.now())).text();if(!h.includes("<option value=\"JA\">JP</option>"))throw Error("JP label not published"); console.log("JP label verified")'
