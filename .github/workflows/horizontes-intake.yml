name: Rebel Mix repertoire validation
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    if: (github.head_ref == 'relight/horizontes-intake' || github.head_ref == 'relight/st30-editorial-hotfix' || github.head_ref == 'relight/st30-artwork-ano-ne' || github.head_ref == 'relight/st30-public-lyric-cleanup' || github.head_ref == 'relight/st30-stanza-recovery' || github.head_ref == 'relight/contextual-repertoire' || github.head_ref == 'relight/el-mismo-sol-authorship' || github.head_ref == 'relight/el-mismo-sol-lyrics' || github.head_ref == 'relight/individual-repertoire-block01' || github.head_ref == 'relight/padoru-and-live-variants' || github.head_ref == 'relight/individual-repertoire-block02' || github.head_ref == 'relight/individual-repertoire-block03' || github.head_ref == 'relight/individual-repertoire-block04' || github.head_ref == 'relight/individual-repertoire-block05' || (github.head_ref == 'relight/post-album-editorial-review' || github.head_ref == 'relight/approved-final-eight-jackets') || github.head_ref == 'relight/padoru-identifiers-final') && github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Preserve all registered artwork
        if: github.head_ref == 'relight/horizontes-intake' || github.head_ref == 'relight/contextual-repertoire' || github.head_ref == 'relight/individual-repertoire-block01' || github.head_ref == 'relight/individual-repertoire-block02' || github.head_ref == 'relight/individual-repertoire-block03' || github.head_ref == 'relight/individual-repertoire-block04' || github.head_ref == 'relight/individual-repertoire-block05' || (github.head_ref == 'relight/post-album-editorial-review' || github.head_ref == 'relight/approved-final-eight-jackets')
        working-directory: KGBlaze-Information-Center
        run: |
          python -m pip install Pillow
          python scripts/preserve-artwork.py --strict
      - name: Record verified new jackets
        if: github.head_ref == 'relight/horizontes-intake' || github.head_ref == 'relight/contextual-repertoire' || github.head_ref == 'relight/individual-repertoire-block01' || github.head_ref == 'relight/individual-repertoire-block02' || github.head_ref == 'relight/individual-repertoire-block03' || github.head_ref == 'relight/individual-repertoire-block04' || github.head_ref == 'relight/individual-repertoire-block05' || (github.head_ref == 'relight/post-album-editorial-review' || github.head_ref == 'relight/approved-final-eight-jackets')
        run: |
          git add KGBlaze-Information-Center/public/music-artwork/
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Preserve new repertoire jackets"
            git push origin HEAD:${{ github.head_ref }}
          fi
      - name: Frame approved Stage 30 artwork
        if: github.head_ref == 'relight/st30-artwork-ano-ne'
        working-directory: KGBlaze-Information-Center
        run: |
          python -m pip install Pillow
          python scripts/frame-stage30-artwork.py
      - name: Record verified Stage 30 crops
        if: github.head_ref == 'relight/st30-artwork-ano-ne'
        run: |
          git add KGBlaze-Information-Center/public/music-artwork/
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Preserve approved Stage 30 square artwork"
            git push origin HEAD:relight/st30-artwork-ano-ne
          fi
      - name: Regression suite
        working-directory: KGBlaze-Information-Center
        run: npm test
      - name: Desktop and mobile browser audit
        working-directory: KGBlaze-Information-Center
        run: |
          npm install --no-save --package-lock=false playwright
          npx playwright install chromium
          node scripts/audit-artwork-visual.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: horizontes-intake-audit
          path: KGBlaze-Information-Center/artwork-audit/
          if-no-files-found: ignore
