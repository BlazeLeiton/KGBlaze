name: Rebel Mix Horizontes intake
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    if: github.head_ref == 'relight/horizontes-intake' && github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: relight/horizontes-intake
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Preserve all registered artwork
        working-directory: KGBlaze-Information-Center
        run: |
          python -m pip install Pillow
          python scripts/preserve-artwork.py --strict
      - name: Record six verified new jackets
        run: |
          git add KGBlaze-Information-Center/public/music-artwork/
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Preserve six new repertoire jackets"
            git push origin HEAD:relight/horizontes-intake
          fi
      - name: Regression suite
        working-directory: KGBlaze-Information-Center
        run: npm test
      - name: Desktop and mobile browser audit
        working-directory: KGBlaze-Information-Center
        run: |
          npm install --no-save --package-lock=false playwright
          npx playwright install chromium
          node scripts/audit-artwork-visual.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: horizontes-intake-audit
          path: KGBlaze-Information-Center/artwork-audit/
          if-no-files-found: ignore
