name: Preserve selected Rebel Mix jackets
on:
  push:
    branches: [relight/music-artwork-preservation]
    paths: ['.github/workflows/preserve-music-artwork.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  preserve:
    if: github.ref == 'refs/heads/relight/music-artwork-preservation'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install image decoder
        run: python -m pip install Pillow
      - name: Capture selected artwork
        run: python KGBlaze-Information-Center/scripts/preserve-music-artwork.py
      - name: Save snapshots on review branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add KGBlaze-Information-Center/public/music-artwork/
          if ! git diff --cached --quiet; then
            git commit -m "assets: preserve selected original-release artwork"
            git push origin HEAD:relight/music-artwork-preservation
          fi
