name: Terminal public launch — anonymous smoke test

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/terminal-public-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  anonymous-public:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Verify production home, Terminal and disabled OAuth anonymously
        shell: bash
        env:
          KGBLAZE_BASE: https://kgblaze.dpdns.org
        run: |
          python3 - <<'PY'
          import json
          import os
          import time
          import urllib.error
          import urllib.request

          base = os.environ['KGBLAZE_BASE'].rstrip('/')
          HEADERS = {'User-Agent': 'KGBlaze-Relight-Public-Smoke/1.0',
                     'Accept': 'application/json, text/html;q=0.8'}
          def fetch(path):
              request = urllib.request.Request(base + path, headers=HEADERS)
              for attempt in range(3):
                  try:
                      with urllib.request.urlopen(request, timeout=20) as r:
                          return r.status, r.read(5_000_000)
                  except urllib.error.HTTPError as error:
                      if error.code < 500 or attempt == 2:
                          # Do not expose body or any provider identifiers.
                          return error.code, b''
                  except (TimeoutError, urllib.error.URLError):
                      if attempt == 2:
                          raise
                  time.sleep(3)
              raise AssertionError('Unreachable: ' + path)

          home_status, home = fetch('/')
          assert home_status == 200 and b'<html' in home.lower(), \
              'Home is not serving HTML with status 200'
          print('PASS: public Home serves HTML')

          viewer_status, viewer = fetch('/departures/')
          assert viewer_status == 200 and b'<html' in viewer.lower(), \
              'Terminal viewer is not serving HTML with status 200'
          print('PASS: public Terminal viewer serves HTML')

          health_status, health_bytes = fetch('/departures/api/health')
          assert health_status == 200, 'Terminal health status != 200'
          health = json.loads(health_bytes)
          assert health.get('ok') is True and \
                 health.get('service') == 'kgblaze-terminal' and \
                 health.get('database') is True, 'Terminal Worker/D1 health mismatch'
          print('PASS: existing Terminal Worker and D1 are healthy')

          agenda_status, agenda_bytes = fetch('/departures/api/public')
          assert agenda_status == 200, 'Public API status != 200'
          agenda = json.loads(agenda_bytes)
          assert isinstance(agenda.get('events'), list), 'Missing public events'
          assert isinstance(agenda.get('sync'), dict), 'Missing public sync'
          assert isinstance(agenda.get('revision'), int), 'Missing editorial revision'
          assert not any('recognition' in k.lower() or 'credential' in k.lower()
                         for k in agenda), 'Private recognition fields leaked'
          print('PASS: public agenda contract and no private recognition fields')

          callback_status, _ = fetch('/twitch/oauth/callback')
          assert callback_status == 400, \
              'Twitch OAuth callback did not reject a missing state safely'
          print('PASS: owner OAuth callback is enabled but rejects missing state')

          status_status, _ = fetch('/departures/api/admin/recognition/twitch/status')
          assert status_status == 401, \
              'Private Twitch status must reject unauthenticated callers'
          root_status, _ = fetch('/api/admin/recognition/twitch/status')
          assert root_status == 404, \
              'Custom domain must not expose root-level private admin alias'
          print('PASS: private Twitch recognition endpoints stay inaccessible anonymously')
          PY
