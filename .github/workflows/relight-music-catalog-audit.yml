name: Relight — complete music catalog audit
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/relight-music-catalog-audit.yml'
      - 'KGBlaze-Information-Center/src/music-*.mjs'
      - 'KGBlaze-Information-Center/src/music-*.js'
      - 'KGBlaze-Information-Center/tests/music-*.test.mjs'
      - 'KGBlaze-Information-Center/public/music-artwork/**'
      - 'KGBlaze-Information-Center/scripts/audit-artwork-visual.mjs'
      - 'KGBlaze-Information-Center/scripts/preserve-artwork.py'
      - 'KGBlaze-Information-Center/scripts/verify-*-production.mjs'
  push:
    branches: [main]
    paths:
      - '.github/workflows/relight-music-catalog-audit.yml'
      - 'KGBlaze-Information-Center/src/music-*.mjs'
      - 'KGBlaze-Information-Center/src/music-*.js'
      - 'KGBlaze-Information-Center/tests/music-*.test.mjs'
      - 'KGBlaze-Information-Center/public/music-artwork/**'
      - 'KGBlaze-Information-Center/scripts/audit-artwork-visual.mjs'
      - 'KGBlaze-Information-Center/scripts/preserve-artwork.py'
      - 'KGBlaze-Information-Center/scripts/verify-*-production.mjs'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  catalog:
    name: Metadata, lyrics, preserved artwork and visual catalog
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Complete Node regression suite
        working-directory: KGBlaze-Information-Center
        run: npm test
      - name: Install image verification tools
        run: python -m pip install Pillow
      - name: Verify and rebuild missing approved artwork
        working-directory: KGBlaze-Information-Center
        run: python scripts/preserve-artwork.py --strict
      - name: Preserve the single missing Brave Shine WebP in the review branch
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'relight/st26-st35-remaining-catalog-integration'
        run: |
          test -s KGBlaze-Information-Center/public/music-artwork/brave-shine-v1.webp
          git add KGBlaze-Information-Center/public/music-artwork/brave-shine-v1.webp KGBlaze-Information-Center/public/music-artwork/preserved-v2.json
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Preserve approved Brave Shine Fate UBW edition jacket locally"
            git push origin HEAD:refs/heads/relight/st26-st35-remaining-catalog-integration
          fi
      - name: Install headless browser tools
        working-directory: KGBlaze-Information-Center
        run: |
          npm install --no-save --package-lock=false playwright
          npx playwright install chromium
      - name: Audit every song in ES, EN and JA across desktop and mobile
        working-directory: KGBlaze-Information-Center
        run: node scripts/audit-artwork-visual.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: music-catalog-full-audit
          path: KGBlaze-Information-Center/artwork-audit/
          if-no-files-found: ignore

  production:
    name: Verify published music after main integration
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: catalog
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check actual HTTP catalog and selected approved credits
        working-directory: KGBlaze-Information-Center
        run: node scripts/verify-current-music-production.mjs
