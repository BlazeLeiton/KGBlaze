name: Editorial comparison previews
on:
  pull_request:
    types: [opened, synchronize]
    branches: [main]
permissions:
  contents: read
jobs:
  preview:
    if: github.head_ref == 'relight/artwork-options-review' && github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: relight/artwork-options-review
      - name: Compose review-only candidates from recovered real frames
        run: |
          python -m pip install Pillow
          python - <<'PY'
          from PIL import Image, ImageOps
          from pathlib import Path
          p=Path('docs/artwork-options')
          def frame(sheet,i):
              im=Image.open(p/(sheet+'-sheet.jpg')).convert('RGB')
              x=(i%3)*480; y=(i//3)*296
              return im.crop((x,y,x+480,y+270))
          for name,i,box in [('izetta-E-running',12,(210,0,480,270)),('izetta-F-closeup',13,(210,0,480,270)),('izetta-G-finale',17,(0,0,270,270))]:
              frame('izetta-ending',i).crop(box).save(p/(name+'.jpg'),quality=96)
          art=Image.open('KGBlaze-Information-Center/public/music-artwork/tempestas-claim-v2.webp').convert('RGB')
          c=Image.new('RGB',(960,960))
          for name,xy,cx in [('petra',(0,0),240),('kotoka',(480,0),240),('meloco',(0,480),240)]:
              im=frame(name,3)
              # Cropping the storm portraits square keeps the artists balanced.
              im=im.crop((cx-120,0,cx+120,240))
              c.paste(im.resize((480,480),Image.Resampling.LANCZOS),xy)
          c.paste(art.resize((480,480),Image.Resampling.LANCZOS),(480,480))
          c.save(p/'tempesta-C-four-panels.jpg',quality=94)
          d=Image.new('RGB',(960,960))
          for i,name in enumerate(['petra','meloco','kotoka']):
              im=frame(name,4)
              # Portraits from the close-up teaser scenes; trim subtitle area.
              im=im.crop((170,0,310,220))
              d.paste(ImageOps.fit(im,(320,680),method=Image.Resampling.LANCZOS,centering=(0.5,0.25)),(i*320,0))
          title=art.crop((0,300,960,650))
          d.paste(title.resize((960,280),Image.Resampling.LANCZOS),(0,680))
          d.save(p/'tempesta-D-triptych.jpg',quality=94)
          PY
      - name: Preserve review previews without touching production
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/artwork-options
          if ! git diff --cached --quiet; then
            git commit -m "Create editorial comparison previews from source frames"
            git push origin HEAD:relight/artwork-options-review
          fi
