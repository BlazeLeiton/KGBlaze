name: Tempesta height adjustment previews
on:
  pull_request:
    types: [opened, synchronize]
    branches: [main]
permissions:
  contents: read
jobs:
  preview:
    if: github.head_ref == 'relight/artwork-options-review' && github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: relight/artwork-options-review
      - name: Arrange original frames only
        run: |
          python -m pip install Pillow imageio-ffmpeg
          python - <<'PY'
          from PIL import Image, ImageOps, ImageDraw
          from pathlib import Path
          import urllib.request, io, subprocess, concurrent.futures, imageio_ffmpeg, tempfile
          p=Path('docs/artwork-options')
          # Source frame: 15 seconds of each official teaser.
          # All three panels use identical scale and crop height, no subtitles or title.
          centers={'petra':241,'meloco':235,'kotoka':218}
          urls={'petra':'https://content.archive.ragtag.moe/s3%3Aarchive-eye-1/xKqHPsDxXBU/xKqHPsDxXBU.webm','kotoka':'https://content.archive.ragtag.moe/s3%3Aarchive-eye/archive-202311/ZLE-wsYXI2o/ZLE-wsYXI2o.webm','meloco':'https://content.archive.ragtag.moe/s3%3Aarchive-eye/archive-202311/7AgV7UGobuc/7AgV7UGobuc.webm'}
          def original(name):
              try:
                  with tempfile.TemporaryDirectory() as tmp:
                      video=Path(tmp)/'clip.webm'; still=Path(tmp)/'frame.png'
                      with urllib.request.urlopen(urllib.request.Request(urls[name],headers={'User-Agent':'Mozilla/5.0'}),timeout=30) as r: video.write_bytes(r.read(20000000))
                      subprocess.run([imageio_ffmpeg.get_ffmpeg_exe(),'-loglevel','error','-ss','15','-i',str(video),'-frames:v','1',str(still)],check=True,timeout=30)
                      with Image.open(still) as img: return name,img.convert('RGB')
              except Exception as e:
                  print('fallback sheet',name,str(e)); return name,None
          with concurrent.futures.ThreadPoolExecutor(max_workers=3) as ex: originals=dict(ex.map(original,centers))
          # Coordinate system is 480 x 270, matching the inspected source sheets.
          # Preserve aspect ratio, avoid the bottom lyric zone, and adjust eye height.
          variants=[
              ('1A',{'petra':(241,8,226),'meloco':(235,0,234),'kotoka':(218,4,230)}),
              ('1B',{'petra':(241,20,214),'meloco':(235,0,224),'kotoka':(218,9,225)}),
              ('1C',{'petra':(241,27,207),'meloco':(235,0,207),'kotoka':(218,13,221)})]
          order=('petra','meloco','kotoka')
          frames={}
          for name in order:
              im=Image.open(p/(name+'-sheet.jpg')).convert('RGB')
              frames[name]=originals[name] or im.crop((0,296,480,566))
          results=[]
          for label,spec in variants:
              canvas=Image.new('RGB',(960,960))
              for i,name in enumerate(order):
                  cx,top,h=spec[name]
                  frame=frames[name]
                  sx=frame.width/480; sy=frame.height/270
                  half=h/6
                  box=tuple(round(z) for z in ((cx-half)*sx,top*sy,(cx+half)*sx,(top+h)*sy))
                  panel=frame.crop(box).resize((320,960),Image.Resampling.LANCZOS)
                  canvas.paste(panel,(i*320,0))
              canvas.save(p/f'tempesta-height-{label}.jpg',quality=96)
              results.append(canvas)
          sheet=Image.new('RGB',(1500,555),'#111827')
          draw=ImageDraw.Draw(sheet)
          for i,(im,(label,_)) in enumerate(zip(results,variants)):
              x=10+i*500
              sheet.paste(im.resize((480,480),Image.Resampling.LANCZOS),(x,10))
              draw.text((x+8,503),label+' | Petra / Meloco / Kotoka',fill='white')
          sheet.save(p/'tempesta-height-comparison.jpg',quality=94)
          # Preserve the exact Shochiku image selected in the previous comparison.
          url='https://cinemaplus.shochiku.co.jp/files_thumbnail/co/main/shumatsunoizetta.jpg/500.jpg'
          req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
          with urllib.request.urlopen(req,timeout=20) as r: raw=r.read(12000000)
          im=Image.open(io.BytesIO(raw)).convert('RGB')
          print('Izetta source dimensions:',im.size)
          # Avoid cutting the original printed title or portrait; white padding only if needed.
          c=Image.new('RGB',(max(im.size),max(im.size)),'white')
          c.paste(im,((c.width-im.width)//2,(c.height-im.height)//2))
          c.save(p/'izetta-bluray-vol1-square.jpg',quality=96)
          PY
      - name: Save preview images without touching production
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/artwork-options
          if ! git diff --cached --quiet; then
            git commit -m "Compare three vertical framing variants of approved order"
            git push origin HEAD:relight/artwork-options-review
          fi
