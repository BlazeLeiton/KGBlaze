name: Relight patch flight YouTube links (branch only)
on:
  push:
    branches:
      - fix/terminal-viewer-editorial-youtube-room-links
    paths:
      - .github/workflows/relight_patch_flight_links.yml
      - KGBlaze-Information-Center/scripts/patch_youtube_flight_cards.py
      - KGBlaze-Information-Center/tests/viewer-flight-links.test.mjs

permissions:
  contents: write

jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch (never main)
        uses: actions/checkout@v4
        with:
          ref: fix/terminal-viewer-editorial-youtube-room-links
          persist-credentials: true
      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Update only the committed public HTML
        working-directory: KGBlaze-Information-Center
        run: python3 scripts/patch_youtube_flight_cards.py
      - name: Run existing and new tests
        working-directory: KGBlaze-Information-Center
        run: npm test
      - name: Commit tested viewer to this feature branch only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- KGBlaze-Information-Center/public/index.html
          if ! git diff --cached --quiet; then
            git commit -m 'fix(terminal): use editorial videoId in flight card'
            git push origin HEAD:fix/terminal-viewer-editorial-youtube-room-links
          fi
